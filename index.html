<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151c">
<title>בריחה מעדנוני המפלצת — המשחק</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#f4f7f5;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:18px}.wrap{width:min(920px,100%);text-align:center}h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}p{color:#c3cfca;margin:8px 0 16px}canvas{display:block;width:100%;height:auto;border:3px solid #42514b;border-radius:16px;background:#18231f;box-shadow:0 20px 60px #0008;touch-action:none}.hint{font-size:14px;color:#aab8b1}.hud{display:flex;justify-content:center;gap:24px;margin:12px;font-weight:bold}.hud span{color:#a6f27a}button{border:0;border-radius:999px;background:#9be86a;color:#14200e;font-weight:bold;padding:12px 24px;font-size:16px;cursor:pointer;margin:10px}
</style>
</head>
<body><main class="wrap"><h1>☣️ בריחה מעדנוני המפלצת!</h1><p>רוצו, קפצו והתחמקו מהעננים הירוקים של המפלצת.</p><div class="hud"><div>ניקוד: <span id="score">0</span></div><div>חיים: <span id="lives">3</span></div></div><canvas id="game" width="900" height="480" aria-label="משחק בריחה ממפלצת"></canvas><button id="restart">מתחילים מחדש</button><p class="hint">תנועה: A שמאלה · D ימינה · W קפיצה (או רווח / ↑) · בטלפון: נגיעה בצד שמאל או ימין</p></main>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');let keys={},player,monster,shots,stars,score,lives,frame,over;
function reset(){player={x:120,y:370,w:38,h:58,vy:0,on:true};monster={x:30,y:285};shots=[];stars=[];score=0;lives=3;frame=0;over=false;scoreEl.textContent=0;livesEl.textContent=3;for(let i=0;i<7;i++)stars.push({x:350+i*100,y:220+Math.random()*140,taken:false});}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','w','arrowup','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(over&&e.key==='Enter')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let touchSide=0;c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();touchSide=(e.clientX-r.left)/r.width<.5?-1:1;if(player.on&&e.clientY<r.top+r.height*.65)player.vy=-13});c.addEventListener('pointerup',()=>touchSide=0);document.getElementById('restart').onclick=reset;
function draw(){x.clearRect(0,0,900,480);let g=x.createLinearGradient(0,0,0,480);g.addColorStop(0,'#263a35');g.addColorStop(1,'#111b19');x.fillStyle=g;x.fillRect(0,0,900,480);for(let i=0;i<9;i++){x.fillStyle='#30463e';x.fillRect(i*115,320+(i%3)*12,65,160)}x.fillStyle='#65736b';x.fillRect(0,430,900,50);x.fillStyle='#9be86a';x.fillRect(0,430,900,5);
// monster
x.fillStyle='#050807';x.beginPath();x.arc(monster.x+75,monster.y+55,62,0,Math.PI*2);x.fill();x.fillRect(monster.x+25,monster.y+90,100,150);x.fillStyle='#b8ff62';x.fillRect(monster.x+42,monster.y+45,14,9);x.fillRect(monster.x+91,monster.y+45,14,9);x.fillStyle='#4dff42';x.fillRect(monster.x+58,monster.y+83,35,7);x.fillStyle='#273b25';x.fillRect(monster.x+42,monster.y+235,24,70);x.fillRect(monster.x+90,monster.y+235,24,70);
// player
x.fillStyle='#f4c58d';x.beginPath();x.arc(player.x+19,player.y+12,14,0,Math.PI*2);x.fill();x.fillStyle='#48a8ff';x.fillRect(player.x+5,player.y+27,28,28);x.fillStyle='#202c38';x.fillRect(player.x+7,player.y+52,9,13);x.fillRect(player.x+24,player.y+52,9,13);
shots.forEach(s=>{x.fillStyle='#65f542';x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();x.fillStyle='#b5ff79';x.beginPath();x.arc(s.x-3,s.y-3,3,0,Math.PI*2);x.fill()});stars.forEach(s=>{if(!s.taken){x.fillStyle='#ffd95e';x.font='27px Arial';x.fillText('★',s.x,s.y)}});
if(over){x.fillStyle='#000a';x.fillRect(0,0,900,480);x.fillStyle='white';x.textAlign='center';x.font='bold 48px Arial';x.fillText('המשחק נגמר!',450,220);x.font='24px Arial';x.fillText('ניקוד: '+score+' · לחצו על מתחילים מחדש',450,270);x.textAlign='start';}}
function tick(){if(!over){frame++;if(keys['arrowleft']||keys['a']||touchSide===-1)player.x-=5;if(keys['arrowright']||keys['d']||touchSide===1)player.x+=5;if((keys[' ']||keys['arrowup']||keys['w'])&&player.on){player.vy=-13;player.on=false}player.vy+=.62;player.y+=player.vy;if(player.y>370){player.y=370;player.vy=0;player.on=true}player.x=Math.max(0,Math.min(860,player.x));if(frame%78===0)shots.push({x:monster.x+100,y:monster.y+130,vx:5+Math.random()*2,vy:(Math.random()-.5)*2,r:13});shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy+Math.sin(frame/12);if(s.x>player.x&&s.x<player.x+player.w&&s.y>player.y&&s.y<player.y+player.h){s.x=1000;lives--;livesEl.textContent=lives;if(lives<=0)over=true}});shots=shots.filter(s=>s.x<950);stars.forEach(s=>{if(!s.taken&&Math.abs(player.x-s.x)<24&&Math.abs(player.y-s.y)<45){s.taken=true;score+=10;scoreEl.textContent=score}});if(frame%500===0)stars.push({x:300+Math.random()*550,y:250+Math.random()*120,taken:false});monster.x=Math.min(65,monster.x+.02)}draw();requestAnimationFrame(tick)}reset();tick();})();
</script></body></html>
