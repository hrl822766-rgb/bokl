<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>בריחה מיואב!</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#f5f7fa;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:18px;text-align:center}main{width:min(850px,100%)}h1{color:#b9ff69;font-size:clamp(30px,5vw,46px)}p{color:#cbd5df}.hud{display:flex;justify-content:space-between;margin:12px auto;max-width:800px;gap:8px}.pill{background:#202b36;border:1px solid #354454;border-radius:99px;padding:9px 15px}.wrap{position:relative;border:3px solid #3a4b5c;border-radius:18px;overflow:hidden}canvas{display:block;width:100%;height:auto;background:#263640;touch-action:none}.overlay{position:absolute;inset:0;background:#071018df;display:grid;place-items:center;padding:20px}.panel{max-width:450px}.panel h2{font-size:32px;color:#b9ff69}.panel button{background:#b9ff69;color:#17210d;border:0;border-radius:12px;padding:13px 28px;font-size:19px;font-weight:bold;cursor:pointer}.hidden{display:none}.hint{font-size:14px;color:#aab8c5}
</style></head>
<body><main><h1>🏃 בריחה מיואב!</h1><p>המפלצת השחורה יואב משפריצה רעל ירוק! תברחו ממנה!</p>
<div class="hud"><span class="pill">ניקוד: <b id="score">0</b></span><span class="pill">שיא: <b id="best">0</b></span><span class="pill">חיים: <b id="lives">3</b> ❤️</span></div>
<div class="wrap"><canvas id="game" width="800" height="500"></canvas>
<div class="overlay" id="start"><div class="panel"><h2>יואב בא! ☠️</h2><p>התחמקו מהרעל הירוק ואספו כוכבים.</p><p>חצים או A/D במקלדת. בטלפון גררו את הדמות.</p><button id="go">מתחילים לברוח!</button></div></div>
<div class="overlay hidden" id="over"><div class="panel"><h2>יואב תפס אותך! 🤢</h2><p>הניקוד שלך: <b id="final">0</b></p><button id="again">לנסות שוב</button></div></div></div><p class="hint">התחמקו 🟢 ואספו ⭐ כדי להגדיל את הניקוד</p></main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let p,shots,stars,score,lives,playing,last,spawn,starTick,keys={},best=+(localStorage.getItem('yoavBest')||0);$('best').textContent=best;
function start(){p={x:400,y:425};shots=[];stars=[];score=0;lives=3;last=0;spawn=0;starTick=0;playing=true;hud();$('start').classList.add('hidden');$('over').classList.add('hidden');requestAnimationFrame(loop)}
function hud(){$('score').textContent=Math.floor(score);$('lives').textContent=lives}
function circ(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,7);x.fill()}
function monster(){x.save();x.translate(650,115);x.fillStyle='#030405';x.beginPath();x.ellipse(0,8,100,90,0,0,7);x.fill();x.beginPath();x.moveTo(-65,-48);x.lineTo(-105,-115);x.lineTo(-28,-72);x.fill();x.beginPath();x.moveTo(65,-48);x.lineTo(105,-115);x.lineTo(28,-72);x.fill();circ(-35,-5,13,'#caff68');circ(35,-5,13,'#caff68');circ(-35,-5,5,'#111');circ(35,-5,5,'#111');x.fillStyle='#8cff38';x.beginPath();x.ellipse(0,45,42,22,0,0,7);x.fill();x.fillStyle='#071008';for(let i=-2;i<=2;i++)x.fillRect(i*14-4,30,8,13);x.restore();x.fillStyle='#fff';x.font='bold 20px Arial';x.fillText('יואב',670,235)}
function human(){x.save();x.translate(p.x,p.y);x.strokeStyle='#f4c08a';x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(-5,20);x.lineTo(-14,39);x.moveTo(5,20);x.lineTo(15,38);x.stroke();x.fillStyle='#3478d4';x.fillRect(-12,-3,24,28);circ(0,-16,13,'#e9a36c');x.fillStyle='#392419';x.beginPath();x.arc(0,-21,13,Math.PI,Math.PI*2);x.fill();x.restore()}
function draw(){x.clearRect(0,0,800,500);x.fillStyle='#263640';x.fillRect(0,0,800,500);x.fillStyle='#1b292d';x.fillRect(0,300,800,200);x.strokeStyle='#63747a';x.setLineDash([25,25]);x.beginPath();x.moveTo(400,300);x.lineTo(400,500);x.stroke();x.setLineDash([]);monster();x.strokeStyle='#9dff39';x.globalAlpha=.4;x.lineWidth=5;x.beginPath();x.moveTo(610,185);x.quadraticCurveTo(540,260,470,300);x.stroke();x.globalAlpha=1;shots.forEach(s=>{circ(s.x,s.y,s.r,'#9cff35');circ(s.x-3,s.y-3,3,'#e4ff9d')});stars.forEach(s=>{x.font='25px Arial';x.fillText('⭐',s.x-12,s.y+9)});human()}
function hit(s){return Math.abs(p.x-s.x)<s.r+13&&Math.abs(p.y-s.y)<s.r+20}
function end(){playing=false;let n=Math.floor(score);best=Math.max(best,n);localStorage.setItem('yoavBest',best);$('best').textContent=best;$('final').textContent=n;$('over').classList.remove('hidden')}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/16.67||1,2);last=t;score+=dt*.12;let speed=5+Math.min(score/100,4);if(keys.ArrowLeft||keys.a||keys.A)p.x-=speed*dt;if(keys.ArrowRight||keys.d||keys.D)p.x+=speed*dt;p.x=Math.max(25,Math.min(775,p.x));spawn+=dt;starTick+=dt;if(spawn>Math.max(13,38-score/18)){shots.push({x:610+(Math.random()-.5)*100,y:195,r:12+Math.random()*5,vy:4+Math.random()*2+score/250,vx:(p.x-610)*.006+(Math.random()-.5)*2});spawn=0}if(starTick>100){stars.push({x:40+Math.random()*720,y:-20});starTick=0}shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt});stars.forEach(s=>s.y+=3*dt);for(let i=shots.length-1;i>=0;i--){if(hit(shots[i])){shots.splice(i,1);lives--;hud();if(lives<=0){end();return}}else if(shots[i].y>530)shots.splice(i,1)}for(let i=stars.length-1;i>=0;i--){if(Math.abs(p.x-stars[i].x)<27&&Math.abs(p.y-stars[i].y)<30){score+=25;stars.splice(i,1)}else if(stars[i].y>520)stars.splice(i,1)}hud();draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);function point(e){let r=c.getBoundingClientRect();p.x=(e.clientX-r.left)*800/r.width}c.addEventListener('pointerdown',e=>{if(playing)point(e)});c.addEventListener('pointermove',e=>{if(playing&&e.buttons)point(e)});$('go').onclick=start;$('again').onclick=start;draw();
</script></body></html>
